name: Auto Update IPTV

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r TVMedia_V2/IPTV_AUTO/requirements.txt

      - name: Run playlist generator
        run: |
          cd TVMedia_V2/IPTV_AUTO
          python multi_playlist_V2.py

      - name: Publish playlists branch
        run: |
          set -e

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          OUTPUT_DIR="TVMedia_V2/IPTV_AUTO/output"

          if [ ! -d "$OUTPUT_DIR" ]; then
            echo "Output directory not found!"
            exit 1
          fi

          # Tạo thư mục tạm chứa playlist
          mkdir -p /tmp/playlists_publish
          cp -r $OUTPUT_DIR/* /tmp/playlists_publish/

          # Kiểm tra branch playlists tồn tại chưa
          if git ls-remote --heads origin playlists | grep playlists; then
            git fetch origin playlists
            git checkout playlists
          else
            git checkout --orphan playlists
          fi

          # Xóa toàn bộ nội dung branch hiện tại
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            -exec rm -rf {} +

          # Copy playlist mới vào root branch
          cp -r /tmp/playlists_publish/* .

          git add .

          LINKS_COUNT=$(cat stats.txt 2>/dev/null || echo "0")

          git diff --cached --quiet && {
            echo "No changes detected"
            exit 0
          }

          git commit -m "Auto update $(date '+%Y-%m-%d %H:%M:%S') (links: ${LINKS_COUNT})"

          git push origin playlists --force
