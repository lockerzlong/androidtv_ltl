name: Auto Update IPTV

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: |
          pip install -r TVMedia/IPTV_AUTO/requirements.txt

      - name: Run script
        run: |
          cd TVMedia/IPTV_AUTO
          python multi_playlist.py

      - name: Publish playlists branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin playlists || true
          git checkout playlists || git checkout --orphan playlists

          cp -r TVMedia/IPTV_AUTO/output/* . || true

          LINKS_COUNT=$(cat TVMedia/IPTV_AUTO/output/stats.txt 2>/dev/null || echo "0")

          git add *.m3u stats.txt || true
          git commit -m "Auto update $(date '+%Y-%m-%d %H:%M:%S') (links: ${LINKS_COUNT})" || echo "No changes"
          git push origin playlists --force
